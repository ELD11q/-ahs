name: Lunar Landing Navigator

on:
  push:
    paths:
      - "lunar-landing-navigator/**"
      - ".github/workflows/lunar-navigator.yml"
  pull_request:
    paths:
      - "lunar-landing-navigator/**"
  workflow_dispatch:
    inputs:
      dem_url:
        description: "Real NASA LOLA DEM file URL (leave empty for the demo scene)"
        required: false
        default: ""
      pixel_size:
        description: "DEM pixel size in metres (real data only)"
        required: false
        default: "20"
      downsample:
        description: "Downsample factor for big rasters (real data only)"
        required: false
        default: "4"
      dem_scale:
        description: "Multiply DEM values by this to get metres (real data only)"
        required: false
        default: "1"
      max_slope:
        description: "Maximum safe slope (degrees)"
        required: false
        default: "10"
      seed:
        description: "Random seed for the demo scene"
        required: false
        default: "7"

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: lunar-landing-navigator
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: lunar-landing-navigator/requirements.txt

      - name: Install
        run: pip install -r requirements.txt

      - name: Tests
        run: python -m pytest -q

      - name: Run on demo scene
        if: ${{ !inputs.dem_url }}
        run: >
          python -m lunar_nav --demo --seed "${{ inputs.seed || '7' }}"
          --max-slope "${{ inputs.max_slope || '10' }}"
          -o output --summary-md "$GITHUB_STEP_SUMMARY"

      - name: Download NASA data
        if: ${{ inputs.dem_url }}
        env:
          DEM_URL: ${{ inputs.dem_url }}
        run: python scripts/download_nasa_data.py "$DEM_URL" -o data

      - name: Run on NASA data
        if: ${{ inputs.dem_url }}
        env:
          DEM_URL: ${{ inputs.dem_url }}
        run: |
          pip install rasterio
          DEM="data/$(basename "$DEM_URL")"
          python -m lunar_nav --dem "$DEM" \
            --pixel-size "${{ inputs.pixel_size }}" \
            --downsample "${{ inputs.downsample }}" \
            --dem-scale "${{ inputs.dem_scale }}" \
            --max-slope "${{ inputs.max_slope }}" \
            -o output --summary-md "$GITHUB_STEP_SUMMARY"

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: landing-sites
          path: |
            lunar-landing-navigator/output/landing_sites_map.html
            lunar-landing-navigator/output/summary.png
            lunar-landing-navigator/output/ranked_regions.csv
            lunar-landing-navigator/output/ranked_regions.json
          retention-days: 30
