name: Lunar Landing Navigator

on:
  push:
    paths:
      - "lunar-landing-navigator/**"
      - ".github/workflows/lunar-navigator.yml"
  pull_request:
    paths:
      - "lunar-landing-navigator/**"
  workflow_dispatch:
    inputs:
      mode:
        description: "nasa = official NASA data (default) · demo = synthetic scene · custom = your own DEM URL"
        type: choice
        options: [nasa, demo, custom]
        default: nasa
      year:
        description: "Mission year for the launch-window analysis (nasa mode)"
        default: "2027"
      max_slope:
        description: "Maximum safe slope (degrees)"
        default: "10"
      dem_url:
        description: "custom mode: DEM file URL"
        default: ""
      pixel_size:
        description: "custom mode: DEM pixel size (m)"
        default: "20"
      downsample:
        description: "custom mode: downsample factor"
        default: "4"
      dem_scale:
        description: "custom mode: multiply DEM values by this to get metres"
        default: "1"

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: lunar-landing-navigator
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: lunar-landing-navigator/requirements.txt
      - run: pip install -r requirements.txt
      - run: python -m pytest -q

  analysis:
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      MODE: ${{ inputs.mode || 'nasa' }}
    defaults:
      run:
        working-directory: lunar-landing-navigator
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: lunar-landing-navigator/requirements.txt
      - run: pip install -r requirements.txt

      - name: Cache NASA products (~1.2 GB)
        if: env.MODE == 'nasa'
        uses: actions/cache@v4
        with:
          path: lunar-landing-navigator/data/nasa
          key: nasa-products-v1

      - name: Analyse the lunar south pole with official NASA data
        if: env.MODE == 'nasa'
        run: >
          python -m lunar_nav --nasa --data-dir data/nasa
          --year "${{ inputs.year || '2027' }}" --max-slope "${{ inputs.max_slope || '10' }}"
          -o output --summary-md "$GITHUB_STEP_SUMMARY"

      - name: Run on the synthetic demo scene
        if: env.MODE == 'demo'
        run: >
          python -m lunar_nav --demo --max-slope "${{ inputs.max_slope || '10' }}"
          -o output --summary-md "$GITHUB_STEP_SUMMARY"

      - name: Run on a custom DEM
        if: env.MODE == 'custom'
        env:
          DEM_URL: ${{ inputs.dem_url }}
        run: |
          python scripts/download_nasa_data.py "$DEM_URL" -o data
          python -m lunar_nav --dem "data/$(basename "$DEM_URL")" \
            --pixel-size "${{ inputs.pixel_size }}" --downsample "${{ inputs.downsample }}" \
            --dem-scale "${{ inputs.dem_scale }}" --max-slope "${{ inputs.max_slope }}" \
            -o output --summary-md "$GITHUB_STEP_SUMMARY"

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: landing-sites-${{ env.MODE }}
          path: |
            lunar-landing-navigator/output/*.html
            lunar-landing-navigator/output/*.png
            lunar-landing-navigator/output/*.csv
            lunar-landing-navigator/output/*.json
            lunar-landing-navigator/output/*.md
          retention-days: 30
